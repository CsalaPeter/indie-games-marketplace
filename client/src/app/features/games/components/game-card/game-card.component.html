<a class="card" [routerLink]="['/game', game().slug]">
	<div class="card__thumbnail">
		@if (game().cardImageUrl === '') {
			<img src="assets/images/no-img.png" />
		} @else {
			<img [src]="getImageUrl(game().cardImageUrl)" />
		}
	</div>
	<div class="card__body">
		<h4 class="card__title">
			{{ game().name }}
		</h4>
		<span class="card__price">
			@if (game().price > 0) {
				{{ game().price | currency: 'EUR' }}
			} @else {
				Free
			}
		</span>
	</div>
</a>
