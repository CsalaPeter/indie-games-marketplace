<section class="game-details">
	@if(game.value(); as game) {
		<h1 class="game-details__title">{{game.name}}</h1>
		<div class="game-details__main">
			<div class="game-details__main__left">
				<div class="game-details__main__left__image-wrapper">
					<img src="assets/images/Placeholder-1920x1080.jpg" alt="">
				</div>
				<div class="game-details__main__left__carousel">
					<svg viewBox="0 0 14 48" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M 12.36,1.3 1.16,24.04 12.36,46.78" id="svg_1" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="fill:#ffffff;fill-opacity:0" />
					</svg>
					<img src="assets/images/Placeholder-1920x1080.jpg" alt="">
					<img src="assets/images/Placeholder-1920x1080.jpg" alt="">
					<img src="assets/images/Placeholder-1920x1080.jpg" alt="">
					<img src="assets/images/Placeholder-1920x1080.jpg" alt="">
					<svg viewBox="0 0 14 48" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M 12.36,1.3 1.16,24.04 12.36,46.78" id="svg_1" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="fill:#ffffff;fill-opacity:0" />
					</svg>
				</div>
			</div>
			<div class="game-details__main__right">
				<div class="game-details__main__right__image-wrapper">
					<img src="assets/images/Placeholder-1920x1080.jpg" alt="">
				</div>
				<p class="game-details__main__right__description">
					Lorem ipsum dolor sit amet consectetur adipiscing elit. Sit amet consectetur adipiscing elit quisque faucibus ex. Adipiscing elit quisque faucibus ex sapien vitae pellentesque.
				</p>
				<div class="game-details__main__right__info">
					<div class="game-details__main__right__info__rating">
						<svg xmlns="http://www.w3.org/2000/svg">
							<use xlink:href="assets/main.svg#rating-star"/>
						</svg>
						<p>4/5</p>
						<p>(200 Ratings)</p>
					</div>
					<p>Published: 2025.09.10</p>
					<p>Updated: 2 Days ago</p>
				</div>
			</div>
		</div>
	}
</section>
