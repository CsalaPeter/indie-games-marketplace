<section class="browse">
	<aside class="browse__filters">
		<app-filter-list
			title="Genres"
			[options]="genres.value()"
			[(selectedOptions)]="selectedGenres"
		/>
		<app-filter-list
			title="Tags"
			[options]="tags.value()"
			[(selectedOptions)]="selectedTags"
			[showLimit]="10"
			[hasSearch]="true"
			[showAllButton]="true"
		/>
		<app-filter-list
			title="Platforms"
			[options]="platforms.value()"
			[(selectedOptions)]="selectedPlatforms"
		/>
	</aside>
	<div class="browse__catalog">
		<div class="browse__sort">
			<form class="browse__form" (submit)="$event.preventDefault()">
				<input
					aria-label="Search input"
					autocomplete="off"
					class="browse__input"
					type="text"
					name="searchField"
					placeholder="Search..."
					[ngModel]="getRawSearchTerm()"
					(ngModelChange)="updateSearchTerm($event)"
				/>
			</form>
			<div class="browse__sortbox">
				<span class="browse__sortbox-text">Sort by</span>
				<button popovertarget="browse__sortbox__list" class="button-main">
					{{ selectedOptionLabel() }}
					<svg xmlns="http://www.w3.org/2000/svg">
						<use xlink:href="assets/main.svg#arrow-left" />
					</svg>
				</button>
				<ul popover id="sortbox__list" class="sortbox__list">
					@for (option of sortOptions; track option.id) {
						<li class="sortbox__list-item">
							<input
								type="radio"
								name="option"
								[id]="option.id"
								[checked]="option.id === selectedOptionId()"
								(click)="onOptionClick($event)"
							/>
							<label [for]="option.id">{{ option.label }}</label>
						</li>
					}
				</ul>
			</div>
		</div>
		@defer {
			<app-games-list [games]="games.value().data" />
		} @loading (minimum 1.5s) {
			<app-games-skeleton />
		}
		<div class="pagination">
			<button (click)="prevPage()" [disabled]="games.value().page === 1">Prev</button>

			<span>Page {{ games.value().page }} / {{ games.value().pages }}</span>

			<button (click)="nextPage()" [disabled]="games.value().page === games.value().pages">
				Next
			</button>
		</div>
	</div>
</section>
