<section class="browse">
	<aside class="browse__filters">
		<app-filter-list
			title="Genres"
			[options]="genres.value()"
			[(selectedOptions)]="selectedGenres"
		/>
		<app-filter-list title="Tags" [options]="tags.value()" [(selectedOptions)]="selectedTags" />
	</aside>
	@defer {
		<app-games-list [games]="games.value()" />
	} @loading (minimum 1.5s) {
		<app-games-skeleton />
	}
</section>
